# SPDX-License-Identifier: GPL-2.0-or-later
#
# The IPQ4029 is a highly integrated system-on-chip (SoC) designed for high-performance, powerefficient,
# and cost-effective 2×2, 802.11ac, dual-band concurrent access-point applications
#
# Product Page:
# https://www.qualcomm.com/networking-infrastructure/products/ipq4029



source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME IPQ4029
}

if { [info exists ENDIAN] } {
   set _ENDIAN $ENDIAN
} else {
   set _ENDIAN little
}

adapter speed 5000
reset_config srst_only srst_nogate

# Set CUP TAP ID based on protocol selection
if { [using_jtag] } {
        set _CPUTAPID 0x5ba00477
} else {
        set _CPUTAPID 0x5ba02477
}

jtag newtap dummy0 tap -irlen 5 -expected-id 0x6e8011dc
jtag newtap dummy1 tap -irlen 5 -expected-id 0xb74008ee
jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id 0x5ba00477

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -ignore-syspwrupack

#cti create $_CHIPNAME.cti -dap $_CHIPNAME.dap -baseaddr 0x87020000 -ap-num 1
cti create IPQ4029.cti0 -dap IPQ4029.dap -ap-num 1 -baseaddr 0x80010000
cti create IPQ4029.cti1 -dap IPQ4029.dap -ap-num 1 -baseaddr 0x80011000
cti create IPQ4029.cti2 -dap IPQ4029.dap -ap-num 1 -baseaddr 0x80012000
cti create IPQ4029.cti3 -dap IPQ4029.dap -ap-num 1 -baseaddr 0x80013000
cti create IPQ4029.cti4 -dap IPQ4029.dap -ap-num 1 -baseaddr 0x80051000
cti create IPQ4029.cti5 -dap IPQ4029.dap -ap-num 1 -baseaddr 0x80052000
cti create IPQ4029.cti6 -dap IPQ4029.dap -ap-num 1 -baseaddr 0x80053000
cti create IPQ4029.cti7 -dap IPQ4029.dap -ap-num 1 -baseaddr 0x80054000

target create $_CHIPNAME.cpu0 cortex_a \
   -endian $_ENDIAN \
   -dap $_CHIPNAME.dap \
   -coreid 0 \
   -dbgbase 0x80040000

target create $_CHIPNAME.cpu1 cortex_a \
   -endian $_ENDIAN \
   -dap $_CHIPNAME.dap \
   -coreid 1 \
   -dbgbase 0x80042000

target create $_CHIPNAME.cpu2 cortex_a \
   -endian $_ENDIAN \
   -dap $_CHIPNAME.dap \
   -coreid 2 \
   -dbgbase 0x80044000

target create $_CHIPNAME.cpu3 cortex_a \
   -endian $_ENDIAN \
   -dap $_CHIPNAME.dap \
   -coreid 3 \
   -dbgbase 0x80046000

# Default breakpoints to hardware breakpoints
gdb breakpoint_override hard
