# SPDX-License-Identifier: GPL-2.0-or-later
#
# The IPQ4029 is a highly integrated system-on-chip (SoC) designed for high-performance, powerefficient,
# and cost-effective 2×2, 802.11ac, dual-band concurrent access-point applications
#
# Product Page:
# https://qualcomm.com

# Include standard helper for Serial Wire / JTAG Debug Port properties
source [find target/swj-dp.tcl]

# Set chip name variable if not already set by an environment/parent script
if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME IPQ4029
}

# Set endianness variable (defaulting to little-endian for ARM Cortex-A)
if { [info exists ENDIAN] } {
   set _ENDIAN $ENDIAN
} else {
   set _ENDIAN little
}

# Configure adapter clock speed to 1000 kHz (1 MHz)
# Note: Decrease this to 1000 if you experience 'STICKY ERROR' issues right after reset
adapter speed 1000

# Configure reset line behavior: use system reset only, and do not gate the clock during reset
reset_config srst_only srst_nogate

# Set CPU TAP ID based on the transport protocol selection (JTAG vs SWD)
if { [using_jtag] } {
        set _CPUTAPID 0x5ba00477
} else {
        set _CPUTAPID 0x5ba02477
}

# JTAG chain
# 1. Certicom / Dummy TAP
jtag newtap $_CHIPNAME dummy0 -irlen 5 -expected-id 0x6e8011dc

# 2. Qualcomm / Dummy TAP
jtag newtap $_CHIPNAME dummy1 -irlen 5 -expected-id 0xb74008ee

# 3. The actual ARM CoreSight Debug Access Port (DAP) for the CPUs
jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID

# 4. Certicom Auxiliary TAP
jtag newtap $_CHIPNAME auto0 -irlen 5 -expected-id 0x000016dd

# 5. Qualcomm Auxiliary TAP
jtag newtap $_CHIPNAME auto1 -irlen 11 -expected-id 0x0003d0e1


# Create the CoreSight DAP instance, ignoring the system power-up acknowledge if unsupported
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -ignore-syspwrupack

# Define Cross Trigger Interface (CTI) configurations required for multi-core debugging synchronization
# (CTI handles simultaneous execution halting across different CPU cores)
cti create $_CHIPNAME.cti0 -dap $_CHIPNAME.dap -ap-num 1 -baseaddr 0x80010000
cti create $_CHIPNAME.cti1 -dap $_CHIPNAME.dap -ap-num 1 -baseaddr 0x80011000
cti create $_CHIPNAME.cti2 -dap $_CHIPNAME.dap -ap-num 1 -baseaddr 0x80012000
cti create $_CHIPNAME.cti3 -dap $_CHIPNAME.dap -ap-num 1 -baseaddr 0x80013000
cti create $_CHIPNAME.cti4 -dap $_CHIPNAME.dap -ap-num 1 -baseaddr 0x80051000
cti create $_CHIPNAME.cti5 -dap $_CHIPNAME.dap -ap-num 1 -baseaddr 0x80052000
cti create $_CHIPNAME.cti6 -dap $_CHIPNAME.dap -ap-num 1 -baseaddr 0x80053000
cti create $_CHIPNAME.cti7 -dap $_CHIPNAME.dap -ap-num 1 -baseaddr 0x80054000

# Create Target configuration for Core 0 (Cortex-A7) with its specific debug base address
target create $_CHIPNAME.cpu0 cortex_a \
   -endian $_ENDIAN \
   -dap $_CHIPNAME.dap \
   -coreid 0 \
   -dbgbase 0x80040000

# Create Target configuration for Core 1 (Cortex-A7)
target create $_CHIPNAME.cpu1 cortex_a \
   -endian $_ENDIAN \
   -dap $_CHIPNAME.dap \
   -coreid 1 \
   -dbgbase 0x80042000

# Create Target configuration for Core 2 (Cortex-A7)
target create $_CHIPNAME.cpu2 cortex_a \
   -endian $_ENDIAN \
   -dap $_CHIPNAME.dap \
   -coreid 2 \
   -dbgbase 0x80044000

# Create Target configuration for Core 3 (Cortex-A7)
target create $_CHIPNAME.cpu3 cortex_a \
   -endian $_ENDIAN \
   -dap $_CHIPNAME.dap \
   -coreid 3 \
   -dbgbase 0x80046000

# Default breakpoints to hardware breakpoints
gdb breakpoint_override hard

# =========================================================================
# MULTI-CORE SMP BEHAVIOR CONFIGURATION
# =========================================================================
# ENABLED (Default): The 4 cores act as a unified cluster. If one core hits a 
# breakpoint or halts, all other cores will halt automatically. This is essential 
# for OS debugging (e.g., Linux/OpenWrt) and prevents 'STICKY ERROR' on the bus.
#
# TO DISABLE SMP: Add a '#' comment prefix to the 'target smp' line below. 
# This separates the cores, allowing individual control via the 'targets' command.

#target smp $_CHIPNAME.cpu0 $_CHIPNAME.cpu1 $_CHIPNAME.cpu2 $_CHIPNAME.cpu3